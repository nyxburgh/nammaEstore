# Reusable Nginx + PHP-FPM template for Core PHP MVC apps with a
# /public web root. Mirrors public/.htaccess exactly:
#   - existing files/directories are served as-is
#   - everything else is routed through public/index.php
#   - .env/.sql/.log/.bak/.sh/.git/.htpasswd/.md are never served
#   - the uploads/ tree can hold files but never executes PHP
#
# Dropped in as /etc/nginx/nginx.conf by the Dockerfile.

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    client_max_body_size 12M; # matches post_max_size in php.ini

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml font/woff2;

    server {
        listen 80 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;

        # Deny the same file types Apache's <FilesMatch> blocks,
        # anywhere in the tree.
        location ~* \.(env|sql|log|bak|sh|git|htpasswd|md)$ {
            deny all;
        }

        # Never execute PHP inside the uploads tree (matches
        # public/uploads/.htaccess and uploads/.htaccess).
        location ^~ /uploads/ {
            location ~* \.php$ {
                deny all;
            }
        }

        # Serve real files/directories directly; otherwise route
        # through the front controller — the Apache rewrite rule's
        # exact behavior.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60;
        }

        # No source maps/dotfiles leak (.htaccess itself, etc.)
        location ~ /\. {
            deny all;
        }
    }
}
